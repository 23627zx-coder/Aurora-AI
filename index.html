<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora AI | 极光智能</title>
    <style>
        body { background-color: #05050f; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .logo-text { font-size: 3rem; font-weight: 900; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 50%, #b224ef 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; margin-bottom: 30px; text-align: center; }
        .chat-box { width: 100%; max-width: 600px; background: #111; border: 1px solid #333; border-radius: 10px; display: flex; flex-direction: column; height: 500px; }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; color: #ddd; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; background: #000; border: 1px solid #444; color: white; border-radius: 5px; outline: none; }
        button { padding: 12px 20px; margin-left: 10px; background: linear-gradient(90deg, #00d2ff, #b224ef); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="logo-text">AURORA AI</div>
    <div class="chat-box">
        <div class="chat-history" id="chat-history">
            <div>System is online. Hello, creator.</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="输入你的指令..." />
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const history = document.getElementById('chat-history');
            const text = input.value.trim();
            if (!text) return;

            history.innerHTML += `<div style="text-align: right; margin: 10px 0; color: #3a7bd5;">User: ${text}</div>`;
            input.value = '';

            // 这里先放个假回复，等后端搭好再换成真接口
            history.innerHTML += `<div style="text-align: left; margin: 10px 0; color: #b224ef;">Aurora: 正在努力思考中... (等待 API 接入)</div>`;
            history.scrollTop = history.scrollHeight;
        }
    </script>
</body>
</html>
