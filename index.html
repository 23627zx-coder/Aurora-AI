<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AURORA | 极光智能</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-obsidian: #05070D;
      --text-offwhite: #F1F5F9;
      --aurora-cyan: #00F0FF;
      --aurora-blue: #3B82F6;
      --aurora-emerald: #34D399;
      --aurora-violet: #8B5CF6;
      --aurora-magenta: #E879F9;
      --scan-intensity: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background-color: var(--bg-obsidian);
      color: var(--text-offwhite);
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 深空黑曜石背景环境极光径向微光 */
    .ambient-nebula-top {
      position: fixed;
      top: -18vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 980px);
      height: 36vh;
      border-radius: 9999px;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 240, 255, 0.065) 0%,
        rgba(139, 92, 246, 0.042) 48%,
        rgba(232, 121, 249, 0.02) 74%,
        transparent 100%
      );
      filter: blur(48px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-nebula-bottom {
      position: fixed;
      bottom: -16vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 900px);
      height: 30vh;
      border-radius: 9999px;
      background: radial-gradient(
        ellipse at center,
        rgba(59, 130, 246, 0.05) 0%,
        rgba(52, 211, 153, 0.03) 48%,
        rgba(139, 92, 246, 0.025) 72%,
        transparent 100%
      );
      filter: blur(46px);
      pointer-events: none;
      z-index: 0;
    }

    /* 固定极简毛玻璃顶栏 */
    .aurora-topbar {
      background: rgba(5, 7, 13, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    }

    /* 左上角 AURORA 几何极光渐变字标 */
    .aurora-brand-wordmark {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      letter-spacing: 0.16em;
      background: linear-gradient(
        90deg,
        #00F0FF 0%,
        #3B82F6 28%,
        #34D399 52%,
        #8B5CF6 76%,
        #E879F9 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.2));
    }

    /* =========================================================================
       莫比乌斯 ∞ 极光路径双向逆流 & 3D 谐波微旋动效
       ========================================================================= */
    @keyframes mobiusSilkForward {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes mobiusSilkCounter {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }

    .mobius-silk-primary {
      stroke-dasharray: 46 154;
      animation: mobiusSilkForward 5.6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .mobius-silk-counter {
      stroke-dasharray: 34 166;
      animation: mobiusSilkCounter 7.2s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    /* 中心翡翠-白光胶囊核心呼吸脉动（基准点 279px, 177.5px，倾斜 -33.3deg） */
    @keyframes coreCapsulePulse {
      0%, 100% {
        opacity: 0.92;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.13);
      }
    }

    .mobius-core-capsule {
      transform-origin: 279px 177.5px;
      animation: coreCapsulePulse 2.8s ease-in-out infinite;
    }

    /* 静息态 ±3.5deg 柔和 3D 谐波微旋（0deg 正立基准） */
    @keyframes mobiusHarmonicIdle {
      0%, 100% {
        transform: perspective(420px) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }
      25% {
        transform: perspective(420px) rotateX(3.2deg) rotateY(-3.5deg) rotateZ(1.6deg);
      }
      50% {
        transform: perspective(420px) rotateX(-2.4deg) rotateY(2.8deg) rotateZ(-1.4deg);
      }
      75% {
        transform: perspective(420px) rotateX(2.6deg) rotateY(3.4deg) rotateZ(1.2deg);
      }
    }

    /* 流式输出态 ±8deg 灵动 3D 轨道微旋 */
    @keyframes mobiusHarmonicStreaming {
      0%, 100% {
        transform: perspective(420px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.02);
      }
      25% {
        transform: perspective(420px) rotateX(7.5deg) rotateY(-8deg) rotateZ(3.8deg) scale(1.06);
      }
      50% {
        transform: perspective(420px) rotateX(-6.5deg) rotateY(7.2deg) rotateZ(-3.2deg) scale(1.04);
      }
      75% {
        transform: perspective(420px) rotateX(6.8deg) rotateY(8deg) rotateZ(2.8deg) scale(1.06);
      }
    }

    .mobius-harmonic-swirl {
      transform-style: preserve-3d;
      will-change: transform;
      animation: mobiusHarmonicIdle 7.8s ease-in-out infinite;
      transition: filter 0.45s ease;
    }

    .mobius-harmonic-swirl.is-streaming {
      animation: mobiusHarmonicStreaming 2.8s ease-in-out infinite;
      filter:
        drop-shadow(0 0 8px rgba(0, 240, 255, 0.55))
        drop-shadow(0 0 14px rgba(232, 121, 249, 0.36));
    }

    .mobius-harmonic-swirl.is-streaming .mobius-silk-primary {
      animation-duration: 2.1s;
    }

    .mobius-harmonic-swirl.is-streaming .mobius-silk-counter {
      animation-duration: 2.7s;
    }

    .mobius-harmonic-swirl.is-streaming .mobius-core-capsule {
      animation-duration: 1.1s;
    }

    /* =========================================================================
       局部 1.5px 细长极光扫描光带（严格裁剪在当前 AI 对话块顶部 24px 条带内）
       ========================================================================= */
    @keyframes auroraScannerGlide {
      0% { transform: translateX(-26%); }
      50% { transform: translateX(154%); }
      100% { transform: translateX(-26%); }
    }

    .aurora-scan-zone {
      position: relative;
      width: 100%;
      height: 24px;
      max-height: 24px;
      margin-bottom: -12px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .aurora-dialogue-block.is-streaming .aurora-scan-zone {
      opacity: var(--scan-intensity, 1);
    }

    .aurora-scan-beam {
      position: absolute;
      top: 0;
      left: 0;
      width: 42%;
      height: 1.5px;
      border-radius: 9999px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(0, 240, 255, 0.92) 24%,
        #34D399 52%,
        rgba(139, 92, 246, 0.92) 78%,
        transparent 100%
      );
      box-shadow:
        0 0 9px rgba(0, 240, 255, 0.65),
        0 0 14px rgba(52, 211, 153, 0.55);
      animation: auroraScannerGlide 3.0s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform;
    }

    .aurora-scan-sheen {
      position: absolute;
      top: 1px;
      left: 0;
      width: 42%;
      height: 22px;
      background: radial-gradient(
        ellipse 50% 95% at 50% 0%,
        rgba(0, 240, 255, 0.2) 0%,
        rgba(52, 211, 153, 0.13) 44%,
        rgba(139, 92, 246, 0.08) 74%,
        transparent 100%
      );
      animation: auroraScannerGlide 3.0s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform;
    }

    /* =========================================================================
       原子级单帧同步：字符 150ms 弧线显影 + 极光光核光标精准贴合
       ========================================================================= */
    @keyframes auroraCharCurveReveal {
      0% {
        opacity: 0.12;
        transform: translate(-3px, 1.5px) scale(0.96);
        color: #00F0FF;
        text-shadow: 0 0 9px rgba(0, 240, 255, 0.85);
      }
      55% {
        opacity: 1;
        transform: translate(-0.6px, 0.3px) scale(1.01);
        color: #34D399;
        text-shadow: 0 0 6px rgba(52, 211, 153, 0.55);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
        color: #F1F5F9;
        text-shadow: none;
      }
    }

    .aurora-char {
      display: inline-block;
      animation: auroraCharCurveReveal 150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity, color;
    }

    /* 紧紧锁定在当前渲染字符边缘的极光能量光标 */
    @keyframes auroraCursorIdleBreath {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 7px #34D399, 0 0 15px rgba(0, 240, 255, 0.9);
      }
      50% {
        opacity: 0.48;
        transform: scale(0.82);
        box-shadow: 0 0 4px #34D399, 0 0 8px rgba(0, 240, 255, 0.45);
      }
    }

    @keyframes auroraCursorTokenTick {
      0% {
        transform: scale(1.38);
        box-shadow: 0 0 10px #FFFFFF, 0 0 18px #00F0FF, 0 0 24px rgba(52, 211, 153, 0.8);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 7px #34D399, 0 0 14px rgba(0, 240, 255, 0.85);
      }
    }

    .aurora-cursor {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 2px;
      vertical-align: middle;
      border-radius: 9999px;
      background: radial-gradient(circle, #FFFFFF 28%, #6EE7B7 68%, #00F0FF 100%);
      animation: auroraCursorIdleBreath 0.82s ease-in-out infinite;
      pointer-events: none;
    }

    .aurora-cursor.is-ticking {
      animation: auroraCursorTokenTick 150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 清空对话时的 260ms 向上微移淡出过渡 */
    .chat-clearing-out {
      opacity: 0 !important;
      transform: translateY(-10px) !important;
      transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1), transform 260ms cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    @keyframes chatWelcomeFadeIn {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-welcome-enter {
      animation: chatWelcomeFadeIn 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 触控按压反馈增强 */
    .tactile-press {
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .tactile-press:active {
      transform: scale(0.94);
    }

    /* 底部悬浮极简指令舱 */
    .floating-input-bar {
      background: rgba(11, 15, 25, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.085);
      box-shadow: 0 18px 42px -12px rgba(0, 0, 0, 0.88);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, transform 0.16s ease;
    }

    .floating-input-bar:focus-within {
      background: rgba(13, 18, 30, 0.92);
      border-color: rgba(0, 240, 255, 0.42);
      box-shadow:
        0 20px 46px -12px rgba(0, 0, 0, 0.9),
        0 0 28px -6px rgba(0, 240, 255, 0.2);
    }

    /* 极光渐变发送按钮 */
    .btn-aurora-send {
      background: linear-gradient(135deg, #00F0FF 0%, #3B82F6 48%, #E879F9 100%);
      background-size: 165% 165%;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-aurora-send:hover {
      background-position: 100% 50%;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35), 0 0 22px rgba(232, 121, 249, 0.3);
      transform: translateY(-1px);
    }

    .btn-aurora-send:active {
      transform: scale(0.94);
    }

    /* 隐形优雅滚动条 */
    .editorial-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .editorial-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .editorial-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.16);
      border-radius: 999px;
    }
    .editorial-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 240, 255, 0.32);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 右侧配置抽屉过渡 */
    .drawer-backdrop {
      transition: opacity 0.28s ease;
    }
    .drawer-panel {
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .code-font {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between selection:bg-cyan-500/25 selection:text-cyan-200">

  <!-- =========================================================================
       全局共享持久化 SVG 渐变与发光滤镜定义（单一全局 <defs>，零重复 ID 冲突）
       ========================================================================= -->
  <svg class="w-0 h-0 absolute pointer-events-none" aria-hidden="true" focusable="false">
    <defs>
      <!-- 左拱外翼：青色 #00F0FF -> 电光蓝 #3B82F6 -->
      <linearGradient id="auroraLeftOuter" x1="42" y1="306" x2="215" y2="92" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="48%" stop-color="#67E8F9"/>
        <stop offset="82%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#3B82F6"/>
      </linearGradient>

      <!-- 左拱内侧深邃钴蓝过渡 -->
      <linearGradient id="auroraLeftRoyal" x1="42" y1="306" x2="260" y2="132" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="42%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>

      <!-- 中段 3D 折叠斜桥：电光蓝 #3B82F6 -> 靛紫 #8B5CF6 -->
      <linearGradient id="auroraCenterCobalt" x1="194" y1="94" x2="332" y2="262" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1D4ED8"/>
        <stop offset="50%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
      </linearGradient>

      <!-- 折叠折痕阴影 -->
      <linearGradient id="auroraFoldCrease" x1="196" y1="92" x2="232" y2="148" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#091E6E" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
      </linearGradient>

      <!-- 右翼主飘带：靛紫 #8B5CF6 -> 品红 #E879F9 -->
      <linearGradient id="auroraRightWing" x1="300" y1="258" x2="482" y2="22" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#6366F1"/>
        <stop offset="38%" stop-color="#8B5CF6"/>
        <stop offset="74%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#E879F9"/>
      </linearGradient>

      <!-- 右上内侧细锥渐变 -->
      <linearGradient id="auroraRightTaper" x1="298" y1="165" x2="482" y2="22" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4F46E5"/>
        <stop offset="52%" stop-color="#8B5CF6"/>
        <stop offset="100%" stop-color="#E879F9"/>
      </linearGradient>

      <!-- 双向丝绸光流渐变 1（正向） -->
      <linearGradient id="auroraSilkPrimary" x1="42" y1="306" x2="482" y2="22" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="48%" stop-color="#34D399"/>
        <stop offset="100%" stop-color="#E879F9"/>
      </linearGradient>

      <!-- 双向丝绸光流渐变 2（逆向） -->
      <linearGradient id="auroraSilkCounter" x1="482" y1="22" x2="42" y2="306" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#E879F9"/>
        <stop offset="50%" stop-color="#8B5CF6"/>
        <stop offset="100%" stop-color="#00F0FF"/>
      </linearGradient>

      <!-- 丝绸路径柔光滤镜 -->
      <filter id="auroraSilkGlow" x="20" y="0" width="484" height="330" filterUnits="userSpaceOnUse">
        <feGaussianBlur stdDeviation="5" result="silkBlur"/>
        <feMerge>
          <feMergeNode in="silkBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- 中心翡翠白光核心发光滤镜 -->
      <filter id="auroraCoreGlow" x="218" y="132" width="122" height="92" filterUnits="userSpaceOnUse">
        <feGaussianBlur stdDeviation="8.5" result="blurOuter"/>
        <feGaussianBlur stdDeviation="3.5" result="blurInner"/>
        <feMerge>
          <feMergeNode in="blurOuter"/>
          <feMergeNode in="blurInner"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <!-- 深空黑曜石环境极光漫反射光晕 -->
  <div class="ambient-nebula-top"></div>
  <div class="ambient-nebula-bottom"></div>

  <!-- 实时鼠标、触控与滚动交互极光轨迹画布（带低端安卓智能降级） -->
  <canvas id="auroraTrailCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

  <!-- 固定极简毛玻璃顶栏 -->
  <header class="aurora-topbar sticky top-0 z-30 w-full shrink-0 px-4 sm:px-6 py-2">
    <div class="max-w-[960px] mx-auto flex items-center justify-between gap-3">
      <!-- 左上角紧凑品牌锁区：正立 46x29px 莫比乌斯徽标 + AURORA 单字几何渐变字标 -->
      <div class="flex items-center gap-2.5 sm:gap-3 select-none">
        <div class="w-[46px] h-[29px] shrink-0 flex items-center justify-center">
          <svg class="mobius-harmonic-swirl w-full h-full drop-shadow-[0_2px_10px_rgba(0,240,255,0.24)]" viewBox="0 0 520 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AURORA 莫比乌斯极光徽标">
            <path d="M 42 306 C 68 232, 95 170, 110 152 C 138 117, 174 88, 198 92 C 208 94, 215 104, 220 116 L 194 132 C 172 132, 148 158, 136 176 C 116 206, 94 246, 78 282 L 258 192 L 260 190 L 42 306 Z"
                  fill="url(#auroraLeftOuter)"/>
            <path d="M 42 306 L 78 282 C 94 246, 116 206, 136 176 C 148 158, 172 132, 194 132 L 186 116 C 162 118, 136 146, 122 168 C 100 202, 74 250, 42 306 Z"
                  fill="url(#auroraLeftRoyal)" opacity="0.92"/>
            <path d="M 198 92 C 214 96, 232 122, 254 152 L 276 180 C 296 206, 314 232, 326 244 C 332 250, 336 256, 336 264 L 316 252 C 302 240, 282 214, 260 186 L 240 160 C 220 135, 204 128, 194 132 Z"
                  fill="url(#auroraCenterCobalt)"/>
            <path d="M 198 92 C 212 96, 226 115, 240 135 L 222 148 C 208 132, 200 128, 194 132 Z"
                  fill="url(#auroraFoldCrease)"/>
            <path d="M 298 165 L 300 164 L 482 22 L 452 54 L 302 167 Z"
                  fill="url(#auroraRightTaper)"/>
            <path d="M 316 252 C 324 258, 332 260, 344 252 C 374 232, 414 156, 452 54 L 482 22 C 448 136, 404 228, 362 256 C 346 267, 332 268, 316 252 Z"
                  fill="url(#auroraRightWing)"/>
            <g filter="url(#auroraSilkGlow)">
              <path d="M 48 300 C 78 210, 144 98, 196 102 C 232 106, 294 244, 334 252 C 374 260, 436 146, 476 30 C 442 134, 384 226, 336 246 C 296 262, 232 130, 194 126 C 148 122, 86 226, 48 300 Z"
                    stroke="url(#auroraSilkPrimary)" stroke-width="3.6" stroke-linecap="round"
                    pathLength="200" class="mobius-silk-primary" opacity="0.9"/>
              <path d="M 48 300 C 78 210, 144 98, 196 102 C 232 106, 294 244, 334 252 C 374 260, 436 146, 476 30 C 442 134, 384 226, 336 246 C 296 262, 232 130, 194 126 C 148 122, 86 226, 48 300 Z"
                    stroke="url(#auroraSilkCounter)" stroke-width="2.6" stroke-linecap="round"
                    pathLength="200" class="mobius-silk-counter" opacity="0.7"/>
            </g>
            <g filter="url(#auroraCoreGlow)" class="mobius-core-capsule">
              <rect x="255" y="171.2" width="48" height="12.6" rx="6.3"
                    transform="rotate(-33.3 279 177.5)" fill="#34D399" opacity="0.72"/>
              <rect x="256.8" y="172.3" width="44.4" height="10.4" rx="5.2"
                    transform="rotate(-33.3 279 177.5)" fill="#6EE7B7" opacity="0.95"/>
              <rect x="258" y="173.25" width="42" height="8.5" rx="4.25"
                    transform="rotate(-33.3 279 177.5)" fill="#FFFFFF"/>
            </g>
          </svg>
        </div>

  <script>
    (function () {
      'use strict';

      /* =========================================================================
         1. 全局状态、触觉反馈工具与预设配置
         ========================================================================= */
      const DEFAULT_SYSTEM_PROMPT = '你是 Aurora-Weave（极光编织），由创始人江城依旧主导开发的 AURORA 极光智能核心。';
            function getInitialGreeting() {
        const hour = new Date().getHours();
        if (hour >= 0 && hour < 6) return '[00:00-06:00 暗夜协议] 系统监测到夜行者接入。我能为你做什么？';
        if (hour >= 6 && hour < 12) return '[06:00-12:00 晨光编译] 晨光数据流已注入。我能为你做什么？';
        if (hour >= 12 && hour < 18) return '[12:00-18:00 高频运转] 核心温度正常。我能为你做什么？';
        return '[18:00-24:00 深空跃迁] 极光频谱已调至夜间模式。我能为你做什么？';
      }

      const SPEED_CONFIG = {
        poetic:   { label: '细腻飘逸', intervalMs: 36, jitterMs: 14, charsPerFrame: 1 },
        standard: { label: '标准极光', intervalMs: 20, jitterMs: 8,  charsPerFrame: 1 },
        swift:    { label: '疾风瞬息', intervalMs: 10, jitterMs: 4,  charsPerFrame: 2 }
      };

      const SCAN_CONFIG = {
        subtle: { label: '微光', opacity: '0.45' },
        normal: { label: '标准', opacity: '1' },
        vivid:  { label: '绚烂', opacity: '1.45' }
      };

      const state = {
        isStreaming: false,
        streamTimer: null,
        abortController: null,
        userScrolledUp: false,
        speedPreset: 'standard',
        scanPreset: 'normal',
        perfMode: 'auto', // 'auto' | 'full' | 'lite' | 'off'
        api: {
          baseUrl: '',
          apiKey: '',
          model: 'aurora-weave',
          systemPrompt: ''
        },
        history: []
      };

      // DOM 引用
      const chatScrollViewport = document.getElementById('chatScrollViewport');
      const chatStreamList = document.getElementById('chatStreamList');
      const promptForm = document.getElementById('promptForm');
      const promptInput = document.getElementById('promptInput');
      const submitActionBtn = document.getElementById('submitActionBtn');
      const btnLabel = document.getElementById('btnLabel');
      const iconSend = document.getElementById('iconSend');
      const iconStop = document.getElementById('iconStop');
      const clearChatBtn = document.getElementById('clearChatBtn');
      const toastBanner = document.getElementById('toastBanner');
      const chipScrollTrack = document.getElementById('chipScrollTrack');
      const chipFadeLeft = document.getElementById('chipFadeLeft');
      const chipFadeRight = document.getElementById('chipFadeRight');

      // 配置抽屉 DOM
      const configDrawerOverlay = document.getElementById('configDrawerOverlay');
      const drawerBackdrop = document.getElementById('drawerBackdrop');
      const drawerPanel = document.getElementById('drawerPanel');
      const openDrawerBtn = document.getElementById('openDrawerBtn');
      const closeDrawerBtn = document.getElementById('closeDrawerBtn');
      const saveConfigBtn = document.getElementById('saveConfigBtn');
      const testScanEffectBtn = document.getElementById('testScanEffectBtn');

      function triggerHaptic(ms = 10) {
        try {
          if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
            navigator.vibrate(ms);
          }
        } catch (_) {}
      }

      function showToast(message) {
        toastBanner.textContent = message;
        toastBanner.classList.remove('opacity-0', '-translate-y-2');
        toastBanner.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastBanner._timer);
        toastBanner._timer = setTimeout(() => {
          toastBanner.classList.remove('opacity-100', 'translate-y-0');
          toastBanner.classList.add('opacity-0', '-translate-y-2');
        }, 2100);
      }

      /* =========================================================================
         2. 设备算力与实时帧率探测器 (DeviceCapabilityDetector)
         ========================================================================= */
      const DeviceCapabilityDetector = (function () {
        let hardwareTier = 'full'; // 'full' | 'lite'
        let runtimeDowngraded = false;
        let slowFrameStreak = 0;
        let lastFrameTime = 0;

        function detectHardware() {
          const mem = navigator.deviceMemory || 8;
          const cores = navigator.hardwareConcurrency || 8;
          const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const isAndroid = /Android/i.test(navigator.userAgent || '');

          if (prefersReduced || mem <= 4 || cores <= 4 || (isAndroid && mem <= 6 && cores <= 6)) {
            hardwareTier = 'lite';
          } else {
            hardwareTier = 'full';
          }
          updatePerfStatusLabel();
        }

        function recordFrame(now) {
          if (lastFrameTime > 0 && state.perfMode === 'auto' && getEffectiveTier() === 'full') {
            const delta = now - lastFrameTime;
            // 若连续出现帧间隔 > 30ms（低于 ~33 FPS），自动平滑降级至轻量光点模式
            if (delta > 30 && delta < 250) {
              slowFrameStreak++;
              if (slowFrameStreak >= 10) {
                runtimeDowngraded = true;
                updatePerfStatusLabel();
              }
            } else {
              slowFrameStreak = Math.max(0, slowFrameStreak - 1);
            }
          }
          lastFrameTime = now;
        }

        function resetFrameClock() {
          lastFrameTime = 0;
          slowFrameStreak = 0;
        }

        function getEffectiveTier() {
          if (state.perfMode === 'off') return 'off';
          if (state.perfMode === 'lite') return 'lite';
          if (state.perfMode === 'full') return 'full';
          return runtimeDowngraded ? 'lite' : hardwareTier;
        }

        function updatePerfStatusLabel() {
          const hintEl = document.getElementById('perfHintText');
          if (!hintEl) return;
          const tier = getEffectiveTier();
          const tierName = tier === 'full' ? '旗舰全效' : tier === 'lite' ? '轻量光点' : '已关闭';
          if (state.perfMode === 'auto') {
            hintEl.textContent = `智能自适应 (${tierName})`;
          } else {
            hintEl.textContent = tierName;
          }
        }

        return {
          detectHardware,
          recordFrame,
          resetFrameClock,
          getEffectiveTier,
          updatePerfStatusLabel
        };
      })();

      /* =========================================================================
         3. 阻尼平滑滚动引擎 (SmoothScroller - 柔和跟流，上滑回看自动礼让)
         ========================================================================= */
      const SmoothScroller = (function () {
        let rafId = null;
        let currentScroll = 0;
        let isAnimating = false;

        function step() {
          if (state.userScrolledUp) {
            isAnimating = false;
            rafId = null;
            return;
          }

          const target = Math.max(0, chatScrollViewport.scrollHeight - chatScrollViewport.clientHeight);
          const diff = target - currentScroll;

          if (Math.abs(diff) < 0.8) {
            chatScrollViewport.scrollTop = target;
            currentScroll = target;
            isAnimating = false;
            rafId = null;
            return;
          }

          // 指数阻尼插值，避免内容突然上推导致旧文本生硬跳出
          currentScroll += diff * 0.22;
          chatScrollViewport.scrollTop = currentScroll;
          rafId = requestAnimationFrame(step);
        }

        function nudge(force) {
          if (force) {
            state.userScrolledUp = false;
          }
          if (state.userScrolledUp) return;

          if (!isAnimating) {
            currentScroll = chatScrollViewport.scrollTop;
            isAnimating = true;
            rafId = requestAnimationFrame(step);
          }
        }

        function snapToTop() {
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          isAnimating = false;
          currentScroll = 0;
          chatScrollViewport.scrollTop = 0;
        }

        return { nudge, snapToTop };
      })();

      // 监听用户主动上滑回看历史消息，避免抢夺滚动条
      let lastViewportScrollTop = 0;
      chatScrollViewport.addEventListener('scroll', () => {
        const st = chatScrollViewport.scrollTop;
        const distFromBottom = chatScrollViewport.scrollHeight - st - chatScrollViewport.clientHeight;
        if (st < lastViewportScrollTop - 6 && distFromBottom > 64) {
          state.userScrolledUp = true;
        } else if (distFromBottom <= 44) {
          state.userScrolledUp = false;
        }
        lastViewportScrollTop = st;
      }, { passive: true });

      /* =========================================================================
         4. 交互极光轨迹引擎 (AuroraTrajectoryEngine - 支持旗舰全效与轻量单光点降级)
         ========================================================================= */
      const AuroraTrajectoryEngine = (function () {
        const canvas = document.getElementById('auroraTrailCanvas');
        const ctx = canvas.getContext('2d');
        const points = [];
        let liteOrb = null; // 轻量模式仅保留单个极光呼吸光点
        let rafId = null;
        let dpr = 1;
        let width = 0;
        let height = 0;
        let lastPointerX = null;
        let lastPointerY = null;
        let lastScrollTop = 0;
        let wavePhase = 0;

        function resize() {
          const tier = DeviceCapabilityDetector.getEffectiveTier();
          const maxDpr = tier === 'lite' ? 1.25 : 2;
          dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function startLoop() {
          if (rafId === null) {
            DeviceCapabilityDetector.resetFrameClock();
            rafId = requestAnimationFrame(render);
          }
        }

        function clear() {
          points.length = 0;
          liteOrb = null;
          ctx.clearRect(0, 0, width, height);
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        }

        function pushPoint(x, y, now) {
          const tier = DeviceCapabilityDetector.getEffectiveTier();
          if (tier === 'off') return;

          if (tier === 'lite') {
            liteOrb = { x, y, time: now };
            startLoop();
            return;
          }

          if (points.length > 0) {
            const prev = points[points.length - 1];
            const dx = x - prev.x;
            const dy = y - prev.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 2.2) return;
            if (dist > 28) {
              const steps = Math.min(Math.floor(dist / 14), 5);
              for (let s = 1; s < steps; s++) {
                const t = s / steps;
                points.push({
                  x: prev.x + dx * t,
                  y: prev.y + dy * t,
                  time: now - (1 - t) * 8
                });
              }
            }
          }

          points.push({ x, y, time: now });
          if (points.length > 120) {
            points.splice(0, points.length - 120);
          }
          startLoop();
        }

        function render(now) {
          DeviceCapabilityDetector.recordFrame(now);
          const tier = DeviceCapabilityDetector.getEffectiveTier();

          if (tier === 'off') {
            clear();
            return;
          }

          ctx.clearRect(0, 0, width, height);

          // 轻量单光点模式（无多段样条、无 shadowBlur，低端安卓机满帧运行）
          if (tier === 'lite') {
            points.length = 0;
            if (!liteOrb) {
              rafId = null;
              return;
            }
            const age = now - liteOrb.time;
            const maxLiteAge = 360;
            if (age > maxLiteAge) {
              liteOrb = null;
              rafId = null;
              return;
            }
            const life = 1 - age / maxLiteAge;
            const radius = 5 + life * 4;
            const grad = ctx.createRadialGradient(liteOrb.x, liteOrb.y, 0, liteOrb.x, liteOrb.y, radius);
            grad.addColorStop(0, `rgba(255, 255, 255, ${(life * 0.88).toFixed(3)})`);
            grad.addColorStop(0.45, `rgba(52, 211, 153, ${(life * 0.55).toFixed(3)})`);
            grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(liteOrb.x, liteOrb.y, radius, 0, Math.PI * 2);
            ctx.fill();

            rafId = requestAnimationFrame(render);
            return;
          }

          // 旗舰全效丝绸样条轨迹模式
          const maxAge = 540;
          while (points.length > 0 && now - points[0].time > maxAge) {
            points.shift();
          }

          if (points.length === 0) {
            rafId = null;
            return;
          }

          if (points.length >= 2) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 11;
            ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';

            for (let i = 1; i < points.length; i++) {
              const p0 = points[i - 1];
              const p1 = points[i];
              const age = now - p1.time;
              const life = Math.max(0, 1 - age / maxAge);
              const posRatio = i / (points.length - 1);
              const envelope = life * posRatio;

              const prevMidX = i > 1 ? (points[i - 2].x + p0.x) * 0.5 : p0.x;
              const prevMidY = i > 1 ? (points[i - 2].y + p0.y) * 0.5 : p0.y;
              const currMidX = (p0.x + p1.x) * 0.5;
              const currMidY = (p0.y + p1.y) * 0.5;

              const grad = ctx.createLinearGradient(prevMidX, prevMidY, currMidX, currMidY);
              const alpha = (envelope * 0.82).toFixed(3);
              grad.addColorStop(0, `rgba(0, 240, 255, ${(alpha * 0.85).toFixed(3)})`);
              grad.addColorStop(0.35, `rgba(59, 130, 246, ${alpha})`);
              grad.addColorStop(0.68, `rgba(52, 211, 153, ${alpha})`);
              grad.addColorStop(1, `rgba(232, 121, 249, ${alpha})`);

              ctx.beginPath();
              ctx.moveTo(prevMidX, prevMidY);
              ctx.quadraticCurveTo(p0.x, p0.y, currMidX, currMidY);
              ctx.strokeStyle = grad;
              ctx.lineWidth = 0.5 + 2.5 * envelope;
              ctx.stroke();
            }

            const head = points[points.length - 1];
            const headLife = Math.max(0, 1 - (now - head.time) / maxAge);
            if (headLife > 0.08) {
              const tipGrad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 7);
              tipGrad.addColorStop(0, `rgba(255, 255, 255, ${(headLife * 0.92).toFixed(3)})`);
              tipGrad.addColorStop(0.45, `rgba(52, 211, 153, ${(headLife * 0.65).toFixed(3)})`);
              tipGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
              ctx.fillStyle = tipGrad;
              ctx.beginPath();
              ctx.arc(head.x, head.y, 7, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.restore();
          }

          rafId = requestAnimationFrame(render);
        }

        function bindEvents() {
          resize();
          window.addEventListener('resize', resize, { passive: true });

          window.addEventListener('pointermove', (e) => {
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            pushPoint(e.clientX, e.clientY, performance.now());
          }, { passive: true });

          window.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
              const t = e.touches[0];
              lastPointerX = t.clientX;
              lastPointerY = t.clientY;
              pushPoint(t.clientX, t.clientY, performance.now());
            }
          }, { passive: true });

          if (chatScrollViewport) {
            lastScrollTop = chatScrollViewport.scrollTop;
            chatScrollViewport.addEventListener('scroll', () => {
              const currentScroll = chatScrollViewport.scrollTop;
              const deltaY = currentScroll - lastScrollTop;
              lastScrollTop = currentScroll;

              if (Math.abs(deltaY) < 1) return;

              const now = performance.now();
              wavePhase += 0.34;
              const anchorX = lastPointerX !== null ? lastPointerX : Math.max(width - 28, width * 0.88);
              const baseY = lastPointerY !== null
                ? lastPointerY
                : Math.min(Math.max(height * 0.25 + (currentScroll % (height * 0.5)), 88), height - 130);

              const waveX = anchorX + Math.sin(wavePhase) * 14;
              const waveY = Math.min(Math.max(baseY + Math.sign(deltaY) * Math.min(Math.abs(deltaY) * 0.45, 22), 68), height - 110);
              pushPoint(waveX, waveY, now);
            }, { passive: true });
          }
        }

        return { bindEvents, resize, clear };
      })();

      /* =========================================================================
         5. 行内莫比乌斯极光徽标工厂（26x17px 正立徽标，共享全局 <defs>）
         ========================================================================= */

      /* =========================================================================
         6. 原子单帧同步字符流与增量 Markdown 构建器
         ========================================================================= */
      function copyCodeById(codeId, btn) {
        triggerHaptic(12);
        const preEl = document.getElementById(codeId);
        if (!preEl) return;
        const text = preEl.innerText;
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          btn.textContent = '已复制 ✓';
          btn.classList.add('text-[#34D399]');
          setTimeout(() => {
            btn.textContent = '复制代码';
            btn.classList.remove('text-[#34D399]');
          }, 1800);
          showToast('代码已复制到剪贴板');
        } catch (_) {
          showToast('复制失败，请手动选取');
        }
        document.body.removeChild(ta);
      }

      function createAtomicAuroraWriter(entryNodes, animateChars = true) {
        const root = entryNodes.proseRoot;
        const cursor = entryNodes.cursorEl;

        let accumulated = '';
        let mode = 'PROSE'; // 'PROSE' | 'CODE_BLOCK'
        let inlineMode = 'TEXT'; // 'TEXT' | 'BOLD' | 'INLINE_CODE'
        let lineStartBuffer = '';
        let atLineStart = true;
        let pendingAsterisk = false;

        let currentLineEl = null;
        let activeInlineEl = null;

        let codeLangEl = null;
        let codeBodyEl = null;
        let readingCodeLang = false;
        let codeLineBuffer = '';

        // 单帧原子队列：确保每个新渲染字符与 .aurora-cursor 在同一 rAF 帧内同步定位
        const charQueue = [];
        let drainRafId = null;
        let onDrainComplete = null;

        function ensureLine() {
          if (!currentLineEl) {
            currentLineEl = document.createElement('div');
            currentLineEl.className = 'aurora-line min-h-[1.75em]';
            root.appendChild(currentLineEl);
            activeInlineEl = currentLineEl;
          }
        }

        function syncCursorAfterNode(parentNode) {
          if (!cursor) return;
          parentNode.appendChild(cursor);
          cursor.classList.remove('is-ticking');
          // 触发轻量化单帧重绘脉冲，使光标紧随新字符同步跃动
          void cursor.offsetWidth;
          cursor.classList.add('is-ticking');
        }

        function appendCharToTarget(target, ch) {
          if (!animateChars || ch === ' ') {
            target.appendChild(document.createTextNode(ch));
          } else {
            const span = document.createElement('span');
            span.className = 'aurora-char';
            span.textContent = ch;
            target.appendChild(span);
          }
          syncCursorAfterNode(target);
        }

        function createCodeBlockCard() {
          const codeId = 'aurora_code_' + Math.random().toString(36).slice(2, 9);
          const wrapper = document.createElement('div');
          wrapper.className = 'my-4 rounded-xl overflow-hidden bg-white/[0.025] border border-white/[0.07]';

          const header = document.createElement('div');
          header.className = 'flex items-center justify-between px-4 py-2 bg-white/[0.025] border-b border-white/[0.05] text-[11px] text-slate-400';

          const langSpan = document.createElement('span');
          langSpan.className = 'code-font text-[#00F0FF] uppercase tracking-wider';
          langSpan.textContent = 'CODE';

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'tactile-press px-2.5 py-1 rounded hover:bg-white/10 text-slate-300 hover:text-cyan-300 cursor-pointer';
          copyBtn.textContent = '复制代码';
          copyBtn.addEventListener('click', () => copyCodeById(codeId, copyBtn));

          header.appendChild(langSpan);
          header.appendChild(copyBtn);

          const pre = document.createElement('pre');
          pre.id = codeId;
          pre.className = 'code-font p-4 text-[13px] leading-relaxed text-slate-200 overflow-x-auto editorial-scroll m-0';

          const code = document.createElement('code');
          pre.appendChild(code);

          wrapper.appendChild(header);
          wrapper.appendChild(pre);
          root.appendChild(wrapper);

          codeLangEl = langSpan;
          codeBodyEl = code;
          readingCodeLang = true;
          codeLineBuffer = '';
          if (cursor) {
            codeBodyEl.appendChild(cursor);
          }
        }

        function flushLineStartBuffer() {
          if (!lineStartBuffer) return;
          const buf = lineStartBuffer;
          lineStartBuffer = '';
          atLineStart = false;
          ensureLine();
          for (const c of buf) {
            processProseChar(c);
          }
        }

        function processProseChar(ch) {
          ensureLine();

          if (pendingAsterisk) {
            pendingAsterisk = false;
            if (ch === '*') {
              if (inlineMode === 'TEXT') {
                inlineMode = 'BOLD';
                const strong = document.createElement('strong');
                strong.className = 'text-white font-semibold';
                currentLineEl.appendChild(strong);
                activeInlineEl = strong;
                if (cursor) activeInlineEl.appendChild(cursor);
              } else if (inlineMode === 'BOLD') {
                inlineMode = 'TEXT';
                activeInlineEl = currentLineEl;
                if (cursor) activeInlineEl.appendChild(cursor);
              } else {
                appendCharToTarget(activeInlineEl, '*');
                appendCharToTarget(activeInlineEl, '*');
              }
              return;
            } else {
              appendCharToTarget(activeInlineEl, '*');
            }
          }

          if (ch === '*') {
            if (inlineMode === 'TEXT' || inlineMode === 'BOLD') {
              pendingAsterisk = true;
              return;
            }
          }

          if (ch === '`') {
            if (inlineMode === 'TEXT') {
              inlineMode = 'INLINE_CODE';
              const codeSpan = document.createElement('code');
              codeSpan.className = 'code-font px-1.5 py-0.5 mx-0.5 rounded bg-cyan-500/10 text-cyan-300 text-[0.88em]';
              currentLineEl.appendChild(codeSpan);
              activeInlineEl = codeSpan;
              if (cursor) activeInlineEl.appendChild(cursor);
              return;
            } else if (inlineMode === 'INLINE_CODE') {
              inlineMode = 'TEXT';
              activeInlineEl = currentLineEl;
              if (cursor) activeInlineEl.appendChild(cursor);
              return;
            }
          }

          appendCharToTarget(activeInlineEl, ch);
        }

        function commitSingleChar(ch) {
          accumulated += ch;

          if (mode === 'CODE_BLOCK') {
            if (readingCodeLang) {
              if (ch === '\n') {
                const lang = codeLineBuffer.trim();
                if (lang) codeLangEl.textContent = lang;
                readingCodeLang = false;
                codeLineBuffer = '';
              } else {
                codeLineBuffer += ch;
              }
              return;
            }

            if (ch === '\n') {
              if (codeLineBuffer.trim() === '```') {
                mode = 'PROSE';
                codeLineBuffer = '';
                codeLangEl = null;
                codeBodyEl = null;
                currentLineEl = null;
                activeInlineEl = null;
                atLineStart = true;
                lineStartBuffer = '';
                return;
              }
              if (codeLineBuffer.length > 0) {
                for (const c of codeLineBuffer) {
                  appendCharToTarget(codeBodyEl, c);
                }
                codeLineBuffer = '';
              }
              codeBodyEl.appendChild(document.createTextNode('\n'));
              syncCursorAfterNode(codeBodyEl);
              return;
            }

            codeLineBuffer += ch;
            if (codeLineBuffer.length > 3 && !codeLineBuffer.startsWith('```')) {
              for (const c of codeLineBuffer) {
                appendCharToTarget(codeBodyEl, c);
              }
              codeLineBuffer = '';
            }
            return;
          }

          if (ch === '\n') {
            if (atLineStart && lineStartBuffer) {
              flushLineStartBuffer();
            }
            if (pendingAsterisk) {
              pendingAsterisk = false;
              ensureLine();
              appendCharToTarget(activeInlineEl, '*');
            }
            ensureLine();
            inlineMode = 'TEXT';
            currentLineEl = null;
            activeInlineEl = null;
            atLineStart = true;
            lineStartBuffer = '';
            return;
          }

          if (atLineStart) {
            lineStartBuffer += ch;

            if (lineStartBuffer === '```') {
              mode = 'CODE_BLOCK';
              atLineStart = false;
              lineStartBuffer = '';
              currentLineEl = null;
              activeInlineEl = null;
              createCodeBlockCard();
              return;
            }

            if (lineStartBuffer === '- ' || lineStartBuffer === '* ') {
              atLineStart = false;
              lineStartBuffer = '';
              currentLineEl = document.createElement('div');
              currentLineEl.className = 'flex items-start gap-2.5 my-1.5';
              const bullet = document.createElement('span');
              bullet.className = 'text-[#34D399] text-xs mt-1.5 select-none shrink-0';
              bullet.textContent = '◆';
              const textWrap = document.createElement('span');
              textWrap.className = 'flex-1 min-w-0';
              currentLineEl.appendChild(bullet);
              currentLineEl.appendChild(textWrap);
              root.appendChild(currentLineEl);
              activeInlineEl = textWrap;
              if (cursor) activeInlineEl.appendChild(cursor);
              return;
            }

            // 提亮斜体引用区块：15px + #CBD5E1 高对比银白字色，户外或低亮度清晰易读
            if (lineStartBuffer === '> ') {
              atLineStart = false;
              lineStartBuffer = '';
              currentLineEl = document.createElement('blockquote');
              currentLineEl.className = 'border-l-2 border-[#00F0FF]/65 pl-3.5 my-2.5 text-[15px] leading-[1.75] text-[#CBD5E1] italic';
              root.appendChild(currentLineEl);
              activeInlineEl = currentLineEl;
              if (cursor) activeInlineEl.appendChild(cursor);
              return;
            }

            if (/^#{1,3} $/.test(lineStartBuffer)) {
              const level = lineStartBuffer.trim().length;
              atLineStart = false;
              lineStartBuffer = '';
              currentLineEl = document.createElement('div');
              currentLineEl.className = level === 1
                ? 'text-white font-bold text-[18px] mt-4 mb-1.5'
                : level === 2
                  ? 'text-white font-semibold text-[17px] mt-3.5 mb-1.5'
                  : 'text-white font-semibold text-[16px] mt-3 mb-1';
              root.appendChild(currentLineEl);
              activeInlineEl = currentLineEl;
              if (cursor) activeInlineEl.appendChild(cursor);
              return;
            }

            const couldBeBlockPrefix =
              '```'.startsWith(lineStartBuffer) ||
              '- '.startsWith(lineStartBuffer) ||
              '* '.startsWith(lineStartBuffer) ||
              '> '.startsWith(lineStartBuffer) ||
              /^#{1,3}$/.test(lineStartBuffer);

            if (!couldBeBlockPrefix) {
              flushLineStartBuffer();
            }
            return;
          }

          processProseChar(ch);
        }

        function drainFrame() {
          drainRafId = null;
          if (charQueue.length === 0) {
            if (onDrainComplete) {
              const cb = onDrainComplete;
              onDrainComplete = null;
              cb();
            }
            return;
          }

          // 若积压较多（如网络突发到达），每帧最多释放 3 个字符保持光点与文字严格贴合
          const batchCount = charQueue.length > 18 ? 3 : charQueue.length > 6 ? 2 : 1;
          for (let i = 0; i < batchCount && charQueue.length > 0; i++) {
            commitSingleChar(charQueue.shift());
          }

          SmoothScroller.nudge(false);

          if (charQueue.length > 0) {
            drainRafId = requestAnimationFrame(drainFrame);
          } else if (onDrainComplete) {
            const cb = onDrainComplete;
            onDrainComplete = null;
            cb();
          }
        }

        function appendChunk(chunk) {
          if (!animateChars) {
            for (const ch of chunk) {
              commitSingleChar(ch);
            }
            return;
          }
          for (const ch of chunk) {
            charQueue.push(ch);
          }
          if (drainRafId === null) {
            drainRafId = requestAnimationFrame(drainFrame);
          }
        }

        function finalize(immediate = false) {
          if (drainRafId !== null && immediate) {
            cancelAnimationFrame(drainRafId);
            drainRafId = null;
          }
          while (charQueue.length > 0) {
            commitSingleChar(charQueue.shift());
          }

          if (mode === 'CODE_BLOCK' && codeLineBuffer && codeLineBuffer.trim() !== '```' && codeBodyEl) {
            for (const c of codeLineBuffer) {
              appendCharToTarget(codeBodyEl, c);
            }
            codeLineBuffer = '';
          }
          if (atLineStart && lineStartBuffer) {
            flushLineStartBuffer();
          }
          if (pendingAsterisk) {
            pendingAsterisk = false;
            ensureLine();
            appendCharToTarget(activeInlineEl, '*');
          }
          if (cursor && cursor.parentNode) {
            cursor.parentNode.removeChild(cursor);
          }
          if (entryNodes.svgEl) {
            entryNodes.svgEl.classList.remove('is-streaming');
          }
          if (entryNodes.block) {
            entryNodes.block.classList.remove('is-streaming');
          }
          SmoothScroller.nudge(false);
          return accumulated;
        }

        function whenDrained(cb) {
          if (charQueue.length === 0 && drainRafId === null) {
            cb();
          } else {
            onDrainComplete = cb;
          }
        }

        return { appendChunk, finalize, whenDrained };
      }

      /* =========================================================================
         7. 对话条目创建与流式调度
         ========================================================================= */
      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function updateActionButtonState(streaming) {
        state.isStreaming = streaming;
        if (streaming) {
          btnLabel.textContent = '停止';
          iconSend.classList.add('hidden');
          iconStop.classList.remove('hidden');
          submitActionBtn.classList.remove('btn-aurora-send');
          submitActionBtn.classList.add('bg-rose-500/20', 'border', 'border-rose-400/35', 'text-rose-200', 'hover:bg-rose-500/30', 'active:scale-95');
        } else {
          btnLabel.textContent = '发送';
          iconStop.classList.add('hidden');
          iconSend.classList.remove('hidden');
          submitActionBtn.classList.remove('bg-rose-500/20', 'border', 'border-rose-400/35', 'text-rose-200', 'hover:bg-rose-500/30', 'active:scale-95');
          submitActionBtn.classList.add('btn-aurora-send');
        }
      }

      let activeFinalizeCallback = null;

      function abortCurrentStream() {
        if (state.streamTimer) {
          clearTimeout(state.streamTimer);
          state.streamTimer = null;
        }
        if (state.abortController) {
          try {
            state.abortController.abort();
          } catch (_) {}
          state.abortController = null;
        }
        if (activeFinalizeCallback) {
          activeFinalizeCallback(true);
          activeFinalizeCallback = null;
        }
        updateActionButtonState(false);
      }

      function runSimulatedAuroraStream(fullText, entryNodes, recordHistory) {
        updateActionButtonState(true);
        state.userScrolledUp = false;

        const writer = createAtomicAuroraWriter(entryNodes, true);

        activeFinalizeCallback = (immediate = false) => {
          const finalStr = writer.finalize(immediate);
          if (finalStr && recordHistory) {
            state.history.push({ role: 'assistant', content: finalStr });
          }
        };

        let idx = 0;
        const len = fullText.length;

        function tick() {
          if (!state.isStreaming) return;

          const cfg = SPEED_CONFIG[state.speedPreset] || SPEED_CONFIG.standard;
          const nextIdx = Math.min(idx + cfg.charsPerFrame, len);
          const chunk = fullText.slice(idx, nextIdx);
          idx = nextIdx;

          writer.appendChunk(chunk);

          if (idx >= len) {
            writer.whenDrained(() => {
              state.streamTimer = setTimeout(() => {
                if (activeFinalizeCallback) {
                  activeFinalizeCallback(false);
                  activeFinalizeCallback = null;
                }
                updateActionButtonState(false);
              }, 160);
            });
            return;
          }

          let wait = cfg.intervalMs + (Math.random() * cfg.jitterMs - cfg.jitterMs / 2);
          if (/[，。！？；：、\n]/.test(chunk)) {
            wait += cfg.intervalMs * 2.2;
          }
          state.streamTimer = setTimeout(tick, Math.max(10, wait));
        }

        state.streamTimer = setTimeout(tick, 90);
      }

      async function runLiveSSEStream(userPrompt, entryNodes) {
        updateActionButtonState(true);
        state.userScrolledUp = false;
        state.abortController = new AbortController();

        const writer = createAtomicAuroraWriter(entryNodes, true);

        activeFinalizeCallback = (immediate = false) => {
          const finalStr = writer.finalize(immediate);
          if (finalStr) {
            state.history.push({ role: 'assistant', content: finalStr });
          }
        };

        let endpoint = state.api.baseUrl.replace(/\/+$/, '');
        if (!endpoint.endsWith('/chat/completions')) {
          endpoint += '/chat/completions';
        }

        const sysPrompt = state.api.systemPrompt.trim() || DEFAULT_SYSTEM_PROMPT;

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(state.api.apiKey ? { Authorization: `Bearer ${state.api.apiKey}` } : {})
            },
            body: JSON.stringify({
              model: state.api.model || 'aurora-weave',
              stream: true,
              messages: [
                { role: 'system', content: sysPrompt },
                ...state.history.slice(-8),
                { role: 'user', content: userPrompt }
              ]
            }),
            signal: state.abortController.signal
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              const payload = trimmed.slice(5).trim();
              if (payload === '[DONE]') continue;

              try {
                const json = JSON.parse(payload);
                const delta = json.choices && json.choices[0] && json.choices[0].delta
                  ? json.choices[0].delta.content || ''
                  : '';
                if (delta) {
                  writer.appendChunk(delta);
                }
              } catch (_) {}
            }
          }

          writer.whenDrained(() => {
            if (activeFinalizeCallback) {
              activeFinalizeCallback(false);
              activeFinalizeCallback = null;
            }
            updateActionButtonState(false);
          });
        } catch (err) {
          if (err && err.name === 'AbortError') {
            if (activeFinalizeCallback) {
              activeFinalizeCallback(true);
              activeFinalizeCallback = null;
            }
            updateActionButtonState(false);
          } else {
            const reason = err && err.message ? err.message : '连接异常';
            const fallbackText = `接口连接未就绪（${reason}），已无缝切换至本地 **Aurora-Weave** 极光核心：\n\n` + buildSignatureResponse(userPrompt);
            runSimulatedAuroraStream(fallbackText, entryNodes, true);
          }
        } finally {
          state.abortController = null;
        }
      }

      /* =========================================================================
         8. 4 项精选指令演示回复库
         ========================================================================= */
      function buildSignatureResponse(prompt) {
        const q = prompt.trim();

        if (q.includes('代码') || q.includes('流式') || q.includes('Python') || q.includes('python')) {
          return `好的，江城依旧。以下为您演示一个具备语义停顿与异步背压控制的 **Python 极光流式生成器**：

\`\`\`python
import asyncio
from typing import AsyncGenerator, Iterable

async def aurora_token_stream(
    tokens: Iterable[str],
    base_delay: float = 0.018
) -> AsyncGenerator[str, None]:
    \"\"\"Aurora-Weave 原子级同步流式生成器\"\"\"
    pause_marks = {"，", "。", "！", "？", "；", "\\n"}
    for token in tokens:
        yield token
        # 在语义标点处注入细腻呼吸停顿
        wait = base_delay * 3.0 if token in pause_marks else base_delay
        await asyncio.sleep(wait)

async def main() -> None:
    stream_tokens = ["极光", "自", "莫比乌斯", "双环", "凝结", "，", "编织", "星海", "思绪", "。"]
    async for chunk in aurora_token_stream(stream_tokens):
        print(chunk, end="", flush=True)

if __name__ == "__main__":
    asyncio.run(main())
\`\`\`

- **单帧原子同步**：每个抵达字符均在同一个 \`requestAnimationFrame\` 渲染帧内与极光能量光标完成定位同步，消除视觉超前或滞后。`;
        }

        if (q.includes('架构') || q.includes('极光编织') || q.includes('介绍')) {
          return `您好，江城依旧。我是 **Aurora-Weave（极光编织）**，运行于 **AURORA** 黑曜石极简交互架构之上：

- **原子级光点同步引擎**：摒弃重绘闪烁，将字符 \`150ms\` 弧线显影与翡翠-亮白光核光标锁定在同一渲染帧内，让文字宛如在光点边缘实时凝结。
- **局部极光扫描光带**：生成期间仅在当前对话块顶部 \`24px\` 裁剪条带内激活 \`1.5px\` 细长扫描光轨，保持全屏深空通透感。
- **双维度硬件自适应**：自动识别设备内存、核心数与实时帧率，在低端安卓设备上平滑切换至轻量单光点模式，确保全平台满帧丝滑。`;
        }

        if (q.includes('诗') || q.includes('深空') || q.includes('极光')) {
          return `**《深空莫比乌斯》**

> 当观测者的视线掠过黑曜石视界，光不再沿直线行进，而是在青色与品红的拓扑曲面上折叠成无尽的莫比乌斯之环。

一缕翡翠微光在交汇处苏醒，
沿着无声的轨道缓缓旋舞；
没有冗余的边框与喧嚣，
只有思想凝结成光点，
在深空尽头为你点亮星河。`;
        }

        if (q.includes('量子') || q.includes('经典') || q.includes('对比')) {
          return `以下是 **量子计算** 与 **经典计算** 在底层范式与算力特征上的核心对比：

- **信息基本单元**：经典计算基于确定性的 **比特（Bit，0 或 1）**；量子计算基于 **量子比特（Qubit）**，可处于 \`0\` 与 \`1\` 的相干叠加态。
- **并行演化机制**：经典处理器按逻辑门序列逐路径运算；量子处理器利用 **量子纠缠与干涉**，在希尔伯特空间中同步演化指数级状态幅值。
- **适用边界**：经典计算擅长通用逻辑控制、数据库与高精度事务；量子计算在 **分子化学模拟、大数分解与组合优化** 领域具备指数级加速潜力。`;
        }

        return `已收到您的指令：**“${q}”**。

正在通过 **Aurora-Weave（极光编织）** 为您实时推演与组织回应：

- **单帧光点同步**：每个新字符均与极光能量光标在同一个渲染帧内完成定位与 \`150ms\` 弧线显影。
- **阻尼平滑跟流**：长文本输出时页面采用指数阻尼柔和推进，您随时可以上滑回看历史内容或点击底部 **「停止」** 中断生成。

请随时下达新的指令，江城依旧。`;
      }

      function submitPrompt(raw) {
        const text = raw.trim();
        if (!text) return;

        if (state.isStreaming) {
          abortCurrentStream();
          return;
        }

        triggerHaptic(12);
        state.history.push({ role: 'user', content: text });
        createUserEntry(text);

        promptInput.value = '';
        promptInput.style.height = 'auto';

        const entryNodes = createAuroraEntry(true, false);

        if (state.api.baseUrl) {
          runLiveSSEStream(text, entryNodes);
        } else {
          runSimulatedAuroraStream(buildSignatureResponse(text), entryNodes, true);
        }
      }

      /* =========================================================================
         9. 快捷胶囊动态边缘渐隐遮罩 & 交互事件绑定
         ========================================================================= */
      function updateChipEdgeFades() {
        if (!chipScrollTrack) return;
        const maxScroll = chipScrollTrack.scrollWidth - chipScrollTrack.clientWidth;
        if (maxScroll <= 2) {
          chipFadeLeft.classList.add('opacity-0');
          chipFadeRight.classList.add('opacity-0');
          return;
        }
        const sl = chipScrollTrack.scrollLeft;
        chipFadeLeft.classList.toggle('opacity-0', sl <= 4);
        chipFadeRight.classList.toggle('opacity-0', sl >= maxScroll - 4);
      }

      if (chipScrollTrack) {
        chipScrollTrack.addEventListener('scroll', updateChipEdgeFades, { passive: true });
        window.addEventListener('resize', updateChipEdgeFades, { passive: true });
      }

      promptForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (state.isStreaming) {
          triggerHaptic(14);
          abortCurrentStream();
        } else {
          submitPrompt(promptInput.value);
        }
      });

      promptInput.addEventListener('focus', () => {
        triggerHaptic(6);
      });

      promptInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 128) + 'px';
      });

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!state.isStreaming) {
            submitPrompt(promptInput.value);
          }
        }
      });

      document.querySelectorAll('.quick-prompt').forEach((btn) => {
        btn.addEventListener('click', () => {
          triggerHaptic(10);
          if (state.isStreaming) abortCurrentStream();
          submitPrompt(btn.getAttribute('data-prompt'));
        });
      });

      // 清空对话：260ms 向上微移淡出过渡后再柔和浮现新欢迎语
      clearChatBtn.addEventListener('click', () => {
        triggerHaptic(12);
        if (state.isStreaming) abortCurrentStream();

        const children = Array.from(chatStreamList.children);
        if (children.length === 0) return;

        children.forEach((el) => el.classList.add('chat-clearing-out'));

        setTimeout(() => {
          chatStreamList.innerHTML = '';
          state.history = [];
          SmoothScroller.snapToTop();
          const welcomeEntry = createAuroraEntry(false, true);
          const writer = createAtomicAuroraWriter(welcomeEntry, false);
          writer.appendChunk(INITIAL_GREETING);
          writer.finalize(true);
          showToast('对话画布已重置');
        }, 260);
      });

      function openDrawer() {
        triggerHaptic(10);
        document.getElementById('cfgBaseUrl').value = state.api.baseUrl;
        document.getElementById('cfgApiKey').value = state.api.apiKey;
        document.getElementById('cfgModel').value = state.api.model;
        document.getElementById('cfgSystemPrompt').value = state.api.systemPrompt;

        configDrawerOverlay.classList.remove('hidden');
        requestAnimationFrame(() => {
          drawerBackdrop.classList.remove('opacity-0');
          drawerBackdrop.classList.add('opacity-100');
          drawerPanel.classList.remove('translate-x-full');
          drawerPanel.classList.add('translate-x-0');
        });
      }

      function closeDrawer() {
        triggerHaptic(8);
        drawerBackdrop.classList.remove('opacity-100');
        drawerBackdrop.classList.add('opacity-0');
        drawerPanel.classList.remove('translate-x-0');
        drawerPanel.classList.add('translate-x-full');
        setTimeout(() => {
          configDrawerOverlay.classList.add('hidden');
        }, 320);
      }

      openDrawerBtn.addEventListener('click', openDrawer);
      closeDrawerBtn.addEventListener('click', closeDrawer);
      drawerBackdrop.addEventListener('click', closeDrawer);

      // 性能与光效模式切换

        btn.addEventListener('click', () => {
          triggerHaptic(8);
          state.perfMode = btn.getAttribute('data-perf');

          AuroraTrajectoryEngine.resize();

          document.querySelectorAll('.perf-choice').forEach((el) => {
            el.className = 'perf-choice tactile-press py-2 px-1.5 rounded-xl text-[11px] border border-white/[0.07] bg-white/[0.02] text-slate-400 hover:text-slate-200 cursor-pointer';
          });
          btn.className = 'perf-choice tactile-press py-2 px-1.5 rounded-xl text-[11px] border border-cyan-400/50 bg-cyan-500/15 text-cyan-200 font-medium cursor-pointer';
        });
      });

      // 吐字节奏切换
      document.querySelectorAll('.speed-choice').forEach((btn) => {
        btn.addEventListener('click', () => {
          triggerHaptic(8);
          state.speedPreset = btn.getAttribute('data-speed');
          document.getElementById('speedHintText').textContent = SPEED_CONFIG[state.speedPreset].label;
          document.querySelectorAll('.speed-choice').forEach((el) => {
            el.className = 'speed-choice tactile-press py-2 px-2 rounded-xl text-xs border border-white/[0.07] bg-white/[0.02] text-slate-400 hover:text-slate-200 cursor-pointer';
          });
          btn.className = 'speed-choice tactile-press py-2 px-2 rounded-xl text-xs border border-cyan-400/50 bg-cyan-500/15 text-cyan-200 font-medium cursor-pointer';
        });
      });

      // 局部扫描光带光感切换
      document.querySelectorAll('.scan-choice').forEach((btn) => {
        btn.addEventListener('click', () => {
          triggerHaptic(8);
          state.scanPreset = btn.getAttribute('data-scan');
          const cfg = SCAN_CONFIG[state.scanPreset];
          document.getElementById('scanHintText').textContent = cfg.label;
          document.documentElement.style.setProperty('--scan-intensity', cfg.opacity);
          document.querySelectorAll('.scan-choice').forEach((el) => {
            el.className = 'scan-choice tactile-press py-2 px-2 rounded-xl text-xs border border-white/[0.07] bg-white/[0.02] text-slate-400 hover:text-slate-200 cursor-pointer';
          });
          btn.className = 'scan-choice tactile-press py-2 px-2 rounded-xl text-xs border border-emerald-400/50 bg-emerald-500/15 text-emerald-200 font-medium cursor-pointer';
        });
      });

      saveConfigBtn.addEventListener('click', () => {
        triggerHaptic(12);
        state.api.baseUrl = document.getElementById('cfgBaseUrl').value.trim();
        state.api.apiKey = document.getElementById('cfgApiKey').value.trim();
        state.api.model = document.getElementById('cfgModel').value.trim() || 'aurora-weave';
        state.api.systemPrompt = document.getElementById('cfgSystemPrompt').value.trim();
        closeDrawer();
        showToast('流式与接口配置已应用');
      });

      testScanEffectBtn.addEventListener('click', () => {
        triggerHaptic(12);
        closeDrawer();
        if (state.isStreaming) abortCurrentStream();
        const previewEntry = createAuroraEntry(true, false);
        runSimulatedAuroraStream(
          '单帧原子光点同步与局部扫描光带已同步激活。移动指针或滑动页面，即可体验自适应极光轨迹。',
          previewEntry,
          false
        );
      });

      function initApp() {
        DeviceCapabilityDetector.detectHardware();
        AuroraTrajectoryEngine.bindEvents();
        updateChipEdgeFades();

        const initialEntry = createAuroraEntry(false, true);
        const writer = createAtomicAuroraWriter(initialEntry, false);
        writer.appendChunk(INITIAL_GREETING);
        writer.finalize(true);
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
