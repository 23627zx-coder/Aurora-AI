<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora AI | 极光智能</title>
    <style>
        body { 
            background-color: #05050f; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .logo-text { 
            font-size: 3rem; 
            font-weight: 900; 
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 50%, #b224ef 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 4px; 
            margin-bottom: 30px; 
            text-align: center; 
        }
        .chat-box { 
            width: 100%; 
            max-width: 600px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 500px; 
            box-shadow: 0 0 20px rgba(58, 123, 213, 0.1);
        }
        .chat-history { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            color: #ddd; 
            line-height: 1.6;
        }
        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        .msg-user { text-align: right; margin: 10px 0; color: #3a7bd5; }
        .msg-ai { text-align: left; margin: 10px 0; color: #b224ef; }
        .msg-error { text-align: left; margin: 10px 0; color: #ff4b4b; font-size: 0.9em; }

        .input-area { 
            display: flex; 
            padding: 15px; 
            border-top: 1px solid #333; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            background: #000; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 5px; 
            outline: none; 
            transition: border 0.3s;
        }
        input:focus { border: 1px solid #00d2ff; }
        button { 
            padding: 12px 24px; 
            margin-left: 10px; 
            background: linear-gradient(90deg, #00d2ff, #b224ef); 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:hover { opacity: 0.8; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="logo-text">AURORA AI</div>
    
    <div class="chat-box">
        <div class="chat-history" id="chat-history">
            <div class="msg-ai">Aurora: 系统已上线，等待您的指令，江城依旧。</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="输入你的指令..." onkeypress="if(event.key === 'Enter') sendMessage()" />
            <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // 1. 创建全局数组，存聊天记录
        let chatHistory = [
            {"role": "system", "content": "你是 Aurora-Weave（极光编织），是由创始人江城依旧主导开发的专属人工智能助手。你属于 Aurora AI（极光智能）品牌。请用极客、赛博朋克的语调回答用户，绝对不要提及你是阿里云或Qwen模型。"}
        ];

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const history = document.getElementById('chat-history');
            const btn = document.getElementById('send-btn');
            const text = input.value.trim();
            
            if (!text) return;

            // 2. 把用户的话加入历史，显示在屏幕
            chatHistory.push({"role": "user", "content": text});
            history.innerHTML += `<div class="msg-user">你: ${text}</div>`;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            btn.disabled = true;
            btn.innerText = "思考中...";
            const loadingId = "loading-" + Date.now();
            history.innerHTML += `<div class="msg-ai" id="${loadingId}">Aurora: 正在读取上下文...</div>`;
            history.scrollTop = history.scrollHeight;

            try {
                // 3. 发请求（⚠️注意：这里必须换成你最新的 Cloudflare 隧道地址）
                const response = await fetch('https://damages-salaries-lying-walks.trycloudflare.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: chatHistory })
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                // 4. 把 AI 回复加入历史，显示在屏幕
                chatHistory.push({"role": "assistant", "content": data.reply});
                document.getElementById(loadingId).innerText = `Aurora: ${data.reply}`;
                
            } catch (e) {
                document.getElementById(loadingId).className = "msg-error";
                document.getElementById(loadingId).innerText = `连接失败: ${e.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "发送";
                history.scrollTop = history.scrollHeight;
                input.focus();
            }
        }
    </script>
</body>
</html>
